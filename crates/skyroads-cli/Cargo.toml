[package]
name = "skyroads-cli"
version = "0.2.0"
edition = "2021"

[dependencies]
skyroads-data = { path = "../skyroads-data" }
skyroads-core = { path = "../skyroads-core" }
# Build-time only: the `export-json` subcommand serializes decoded levels/palettes to JSON
# for the web/ neon 3D game. Kept in this leaf binary so the library crates stay zero-dependency.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
