<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05010d">
<title>NEONDRIFT — SkyRoads neon 3D</title>
<style>
  html,body{ margin:0; height:100%; background:#05010d; color:#eafcff; overflow:hidden;
    font-family:'Segoe UI',system-ui,sans-serif; }
  #c{ display:block; width:100vw; height:100vh; touch-action:none; }
  #hud{ position:fixed; top:10px; left:12px; z-index:10; font-size:13px; letter-spacing:.08em;
    color:#8fb7c9; text-shadow:0 1px 3px #000; user-select:none; pointer-events:none; white-space:pre; }
  #err{ position:fixed; bottom:10px; left:12px; z-index:10; color:#ff2b4e; font-size:13px; white-space:pre-wrap; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js",
               "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="c" aria-label="NEONDRIFT 3D race view" role="img"></canvas>
<div id="hud" role="status" aria-live="polite"></div>
<div id="err" role="alert"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
